name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.24.1"

      - name: Fix Gradle and wakelock_plus SDK version
        run: |
          flutter pub cache add wakelock_plus -v 1.4.0
          sed -i 's/flutter\.compileSdkVersion/35/g' ~/.pub-cache/hosted/pub.dev/wakelock_plus-1.4.0/android/build.gradle
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/g' $(dirname $(which flutter))/../packages/flutter_tools/gradle/src/main/groovy/flutter.groovy || true
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              beforeEvaluate { project ->
                  if (!project.hasProperty("flutter")) {
                      project.ext.flutter = [
                          compileSdkVersion: 35,
                          minSdkVersion: 21,
                          targetSdkVersion: 35,
                          ndkVersion: "25.1.8937393"
                      ]
                  }
              }
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android.compileSdkVersion(35)
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: |
          cd mobile_app
          flet build apk -v

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: igos-android-apk
          path: |
            mobile_app/build/apk/*.apk
            **/*.apk
