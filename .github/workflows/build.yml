name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build APK with Flet
        uses: flet-dev/build-apk-action@v1
        with:
          project-path: 'mobile_app'
          package-name: 'com.igos.trading'
          product-name: 'IGOS'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
